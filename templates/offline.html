{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>Không truy vấn được Neo4j</h2>
  <div class="alert err">{{ loi }}</div>
  <ol>
    <li>Kiểm tra Neo4j đang chạy: <code>docker ps</code> (hoặc <code>docker start neo4j</code>).</li>
    <li>Kiểm tra địa chỉ và mật khẩu trong file <code>.env</code> (hiện tại: <code>{{ uri }}</code>).</li>
    <li>Nạp tri thức: <code>python -m src.seed</code></li>
  </ol>
</div>
{% endblock %}
